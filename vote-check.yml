name: Vérification vote PixelSMP (temps réel)

on:
  schedule:
    - cron: "0 */6 * * *"   # relance toutes les 6h, le script tourne en continu entre-temps
  workflow_dispatch:          # permet de lancer manuellement depuis GitHub

concurrency:
  group: vote-check
  cancel-in-progress: false   # ne coupe pas un run en cours si un nouveau se déclenche

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355       # un peu moins que les 6h max de GitHub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Surveiller les votes en continu
        env:
          PSEUDO: ${{ secrets.PSEUDO }}
          TOPIC: ${{ secrets.TOPIC }}
        run: python continuous_check.py

      - name: Garder la capture d'écran de debug (si présente)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug.png
          if-no-files-found: ignore
